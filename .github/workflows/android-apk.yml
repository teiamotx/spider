name: Android debug APK

on:
  push:
    branches:
      - claude/godot-web-swing-android-1hy26n
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_VERSION: "4.7.1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform and build tools
        run: |
          set -euo pipefail
          echo "Android SDK: ${ANDROID_HOME:?ANDROID_HOME is not set on this runner}"
          sdkmanager_bin=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          (yes || true) | "$sdkmanager_bin" --licenses > /dev/null
          "$sdkmanager_bin" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Godot and export templates
        run: |
          set -euo pipefail
          release=$(curl -fsSL -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/godotengine/godot/releases/tags/${GODOT_VERSION}-stable")
          echo "Assets in Godot ${GODOT_VERSION}-stable:"
          echo "$release" | jq -r '.assets[].name'

          # Prefer the headless build. Fall back to the editor binary, which also runs with --headless.
          godot_url=$(echo "$release" | jq -r '[.assets[] | select(.name | test("linux.*headless.*[.]zip$"))][0].browser_download_url // empty')
          if [ -z "$godot_url" ]; then
            godot_url=$(echo "$release" | jq -r '[.assets[] | select(.name | test("linux[.]x86_64[.]zip$"))][0].browser_download_url // empty')
          fi
          templates_url=$(echo "$release" | jq -r '[.assets[] | select(.name | test("export_templates.*[.]tpz$"))][0].browser_download_url // empty')
          if [ -z "$godot_url" ] || [ -z "$templates_url" ]; then
            echo "Could not find the Godot Linux build or export templates in the release" >&2
            exit 1
          fi
          echo "Godot build: $godot_url"
          echo "Templates: $templates_url"

          mkdir -p "$RUNNER_TEMP/godot"
          curl -fsSL -o "$RUNNER_TEMP/godot/godot.zip" "$godot_url"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          bin=$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name "Godot_v*" ! -name "*.zip" | head -n 1)
          chmod +x "$bin"
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"

          curl -fsSL -o "$RUNNER_TEMP/godot/templates.tpz" "$templates_url"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          templates_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates_dir"
          cp -r "$RUNNER_TEMP/godot/templates/templates/." "$templates_dir/"

      - name: Create a debug keystore
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Point Godot at the JDK, Android SDK, and keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${RUNNER_TEMP}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import assets and export the debug APK
        run: |
          set -euo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --path . --import || true
          "$GODOT_BIN" --headless --path . --export-debug "Android" build/spider-debug.apk
          ls -lh build/

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: spider-debug-apk
          path: build/spider-debug.apk
          if-no-files-found: error
